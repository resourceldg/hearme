[project]
name = "hearme"
version = "0.1.0"
description = "Plataforma abierta para democratizar el acceso a lecturas en voz de alta calidad"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "HearMe contributors" }]
keywords = ["tts", "accessibility", "audiobook", "dyslexia", "talking-library", "prosody", "narration"]

# Núcleo: sin torch, sin modelos. Instalable en segundos.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "anyio>=4.6",
    # Cifrado del almacén, del perfil y de las sesiones privadas. Apache-2.0/BSD:
    # cumple la política de licencias permisivas del núcleo. Es la única
    # dependencia criptográfica, a propósito: menos código en el camino crítico
    # de seguridad es en sí mismo una propiedad de seguridad.
    "cryptography>=43",
]

[project.optional-dependencies]
# --- Parsers de formato ---
documents = [
    "pypdfium2>=4.30",       # Apache-2.0/BSD-3 — render, TOC, páginas
    "pdfminer.six>=20240706", # MIT — extracción con atributos de fuente
    "ebooklib>=0.18",         # EPUB
    "beautifulsoup4>=4.12",   # HTML/EPUB
    "lxml>=5.3",
    "markdown-it-py>=3.0",
    "python-docx>=1.1",
    "odfpy>=1.4",
    "striprtf>=0.0.28",
    "feedparser>=6.0",        # RSS
    "charset-normalizer>=3.4",
]
# --- TTS ---
tts-piper = ["piper-tts>=1.2", "onnxruntime>=1.20"]
tts-kokoro = ["kokoro>=0.9", "soundfile>=0.12", "numpy>=1.26"]
# XTTS-v2: licencia CPML NO COMERCIAL. Opt-in consciente.
tts-xtts = ["coqui-tts>=0.25"]
# --- Traducción ---
# `torch` va aquí porque el traductor lo usa de verdad: marian.py llama a
# `torch.inference_mode()` y carga los modelos con transformers. Antes el extra
# declaraba `ctranslate2`, que NO se usa en ninguna parte del código, y omitía
# torch: instalar el extra completo seguía dando «No module named 'torch'».
#
# En la imagen Docker se instala la rueda de CPU (ver docker/Dockerfile): la
# variante por defecto arrastra CUDA y ~2,5 GB que un servidor sin GPU no usa.
translate = ["transformers>=4.46", "sentencepiece>=0.2", "torch>=2.4"]
# --- OCR (requiere binarios del sistema: tesseract-ocr, ghostscript) ---
ocr = ["ocrmypdf>=16.6"]
# --- Extra AGPL, nunca importado por el núcleo ---
pymupdf = ["pymupdf>=1.24"]

postgres = ["asyncpg>=0.30"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

# Todo lo que no arrastra licencias restrictivas ni acelerador obligatorio
all = [
    "hearme[documents,tts-piper,tts-kokoro,translate,ocr]",
]

[project.scripts]
hearme = "hearme.interfaces.cli.main:app"

[project.entry-points."hearme.plugins"]
# Plugins internos, descubiertos por el mismo mecanismo que los de terceros.
builtin = "hearme.infrastructure.registry:register_builtins"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearme"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # Depends() en firmas FastAPI

[tool.ruff.lint.per-file-ignores]
# Listas de marcadores lingüísticos: partirlas por ancho las haría ilegibles.
"src/hearme/application/language.py" = ["E501"]
# Ligaduras y guiones no separables son literales intencionados, no erratas.
"src/hearme/application/cleaning.py" = ["RUF001"]
"src/hearme/application/chunker.py" = ["RUF001"]
# El signo de multiplicación en «×1,3» es intencionado: describe un multiplicador
# en prosa, y sustituirlo por una equis lo haría menos legible.
"src/hearme/knowledge/knowledge.py" = ["RUF002"]
"src/hearme/privacy/profile.py" = ["RUF002"]
"src/hearme/knowledge/sharing.py" = ["RUF002"]
# «24×24 px» es la notación de la propia norma WCAG; escribirlo con equis
# latina lo alejaría del texto que cita.
"tests/test_design_tokens.py" = ["RUF002"]

[tool.mypy]
python_version = "3.12"
packages = ["hearme"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = ["slow: requiere modelos descargados", "integration: extremo a extremo"]
